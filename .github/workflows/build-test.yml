#
# Build the fuzz-fill test environment and run unit + integration tests.
# Runs on PRs and after every merge to main.

name: Build and test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'integration-tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/build-test.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'integration-tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  WORK_ROOT: /work
  LLVM_APT_MAJOR: "24"
  LLVM_RELEASE_BIN: /usr/lib/llvm-24/bin
  VENV_DIR: /work/fuzz-fill-venv
  VENV_BIN: /work/fuzz-fill-venv/bin
  # nproc inside this container can be the host CPU count.
  FUZZ_FILL_E2E_JOBS: "32"

jobs:
  build-and-test:
    runs-on: aws-linux-scale-rocm-medium
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    container:
      image: ubuntu:24.04
    env:
      LLVM_RELEASE_VERSION: "22.1.8"
      SANCOV_ALLOWLIST: scripts/allowlist-amdgpu.txt
      LLVM_PROJECT_DIR: /work/llvm-project
      LLVM_BUILD_DIR: /work/llvm-build-sancov
      LLVM_BUILD_BIN: /work/llvm-build-sancov/bin
      FUZZ_FILL_SANCOV: /work/llvm-build-sancov/bin/sancov
      FUZZ_FILL_LLVM_LIT: /work/llvm-build-sancov/bin/llvm-lit
      FUZZ_FILL_LLC: /work/llvm-build-sancov/bin/llc
      FUZZ_FILL_OPT: /work/llvm-build-sancov/bin/opt
      FUZZ_FILL_LLVM_REDUCE: /work/llvm-build-sancov/bin/llvm-reduce
      FUZZ_FILL_LLVM_DIS: /work/llvm-build-sancov/bin/llvm-dis
      FUZZ_FILL_LLVM_REPO: /work/llvm-project

    steps:
      - name: Report container resources
        run: |
          echo "nproc=$(nproc) nproc_all=$(nproc --all)"
          awk '/MemTotal/ {printf "mem_total_gib=%.1f\n", $2/1024/1024}' /proc/meminfo
          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            max="$(cat /sys/fs/cgroup/memory.max)"
            if [[ "$max" == "max" ]]; then
              echo "cgroup_memory_max=unlimited"
            else
              awk -v b="$max" 'BEGIN {printf "cgroup_memory_max_gib=%.1f\n", b/1024/1024/1024}'
            fi
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install apt packages
        run: ./scripts/image/install-apt-packages.sh all

      - name: Install CMake
        run: ./scripts/image/install-cmake.sh

      - name: Install apt.llvm.org bootstrap
        run: ./scripts/image/install-llvm-apt.sh "${LLVM_APT_MAJOR}"

      - name: Restore LLVM source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-llvm-source
        with:
          path: ${{ env.LLVM_PROJECT_DIR }}
          key: fuzz-fill-llvm-source-${{ env.LLVM_RELEASE_VERSION }}

      - name: Download llvm-project source
        if: steps.cache-llvm-source.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${LLVM_PROJECT_DIR}"
          curl -fsSL "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${LLVM_RELEASE_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C "${LLVM_PROJECT_DIR}"

      - name: Build sancov LLVM
        run: |
          bash ./scripts/ci-cgroup-memstat.sh 30 &
          memstat_pid=$!
          trap 'kill "$memstat_pid" 2>/dev/null || true' EXIT
          ./scripts/build-llvm-sancov.sh \
            "${SANCOV_ALLOWLIST}" \
            "${LLVM_PROJECT_DIR}" \
            "${LLVM_BUILD_DIR}" \
            --bootstrap-bin "${LLVM_RELEASE_BIN}" \
            --enable-projects clang \
            "${FUZZ_FILL_E2E_JOBS}"

      - name: Install fuzz-fill venv
        run: |
          python3 -m venv "${VENV_DIR}"
          "${VENV_BIN}/pip" install --no-cache-dir -e "${GITHUB_WORKSPACE}"

      - name: Run unit tests
        run: |
          source "${VENV_DIR}/bin/activate"
          python -m unittest discover -s tests -v

      - name: Run integration tests
        run: |
          bash ./scripts/ci-cgroup-memstat.sh 30 &
          memstat_pid=$!
          trap 'kill "$memstat_pid" 2>/dev/null || true' EXIT
          source "${VENV_DIR}/bin/activate"
          ./integration-tests/test.sh \
            --venv "${VENV_DIR}" \
            --llvm-build "${LLVM_BUILD_BIN}" \
            --llvm-sancov-build "${LLVM_BUILD_BIN}" \
            --llvm-src "${LLVM_PROJECT_DIR}" \
            -v integration-tests/

  e2e:
    runs-on: aws-linux-scale-rocm-medium
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    container:
      image: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        pr: ["214457", "230193"]
    env:
      LLVM_MIRROR_DIR: /work/llvm-mirror

    steps:
      - name: Report container resources
        run: |
          echo "nproc=$(nproc) nproc_all=$(nproc --all)"
          awk '/MemTotal/ {printf "mem_total_gib=%.1f\n", $2/1024/1024}' /proc/meminfo
          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            max="$(cat /sys/fs/cgroup/memory.max)"
            if [[ "$max" == "max" ]]; then
              echo "cgroup_memory_max=unlimited"
            else
              awk -v b="$max" 'BEGIN {printf "cgroup_memory_max_gib=%.1f\n", b/1024/1024/1024}'
            fi
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install apt packages
        run: ./scripts/image/install-apt-packages.sh all

      - name: Install CMake
        run: ./scripts/image/install-cmake.sh

      - name: Install apt.llvm.org bootstrap and FileCheck
        run: |
          ./scripts/image/install-llvm-apt.sh "${LLVM_APT_MAJOR}"
          apt-get update
          apt-get install -y --no-install-recommends "llvm-${LLVM_APT_MAJOR}" "llvm-${LLVM_APT_MAJOR}-tools"
          test -x "${LLVM_RELEASE_BIN}/FileCheck"

      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Install fuzz-fill venv
        run: |
          python3 -m venv "${VENV_DIR}"
          "${VENV_BIN}/pip" install --no-cache-dir -e "${GITHUB_WORKSPACE}"

      - name: Compute mirror cache key
        id: mirror-cache-key
        run: |
          echo "week=$(date -u +%G-%V)" >> "${GITHUB_OUTPUT}"

      - name: Restore filtered llvm-project mirror
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-mirror
        with:
          path: ${{ env.LLVM_MIRROR_DIR }}
          key: fuzz-fill-llvm-mirror-${{ steps.mirror-cache-key.outputs.week }}
          restore-keys: |
            fuzz-fill-llvm-mirror-

      - name: Clone filtered llvm-project mirror
        if: steps.cache-mirror.outputs.cache-matched-key == ''
        run: |
          git clone --filter=blob:none "https://github.com/llvm/llvm-project.git" "${LLVM_MIRROR_DIR}"

      - name: Save filtered llvm-project mirror
        if: steps.cache-mirror.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LLVM_MIRROR_DIR }}
          key: ${{ steps.cache-mirror.outputs.cache-primary-key }}

      - name: Warm mirror for e2e PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/warm-llvm-mirror-for-pr.sh "${LLVM_MIRROR_DIR}" --pr-id "${{ matrix.pr }}"

      - name: Run e2e integration tests
        env:
          GH_TOKEN: ${{ github.token }}
          FUZZ_FILL_E2E_BOOTSTRAP_BIN: ${{ env.LLVM_RELEASE_BIN }}
        run: |
          source "${VENV_DIR}/bin/activate"
          # Lit buffers each test until it exits. The tests tee phases here so
          # this tail shows them while the test is still running.
          e2e_log=/work/e2e-progress.log
          : > "$e2e_log"
          tail -f "$e2e_log" &
          tail_pid=$!
          bash ./scripts/ci-cgroup-memstat.sh 30 &
          memstat_pid=$!
          set +e
          ./integration-tests/test.sh \
            --venv "${VENV_DIR}" \
            --llvm-build "${LLVM_RELEASE_BIN}" \
            --llvm-src "${LLVM_MIRROR_DIR}" \
            --param e2e=1 \
            --filter="pr-${{ matrix.pr }}\.test$" \
            -j 1 \
            -v integration-tests/e2e/
          status=$?
          kill "$tail_pid" "$memstat_pid" 2>/dev/null || true
          wait "$tail_pid" "$memstat_pid" 2>/dev/null || true
          exit "$status"
